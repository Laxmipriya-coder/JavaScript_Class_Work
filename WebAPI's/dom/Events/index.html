<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <nav class="bg-warning p-3 fs-3">
        Counter APP
    </nav>
    <section class="mt-5 text-center">
        <div class="border border-warning p-4" style="width: 300px;" text-align:center>
            <h1>Couter App</h1>
            <h2 id="hii">Hii</h2>
            <button class="btn btn-outline-danger" onclick="deccount()">Decrement</button>
            <button class="btn btn-outline-warning" onclick="inccount()">Increment</button>
        </div>
    </section>
    <script>
        let h2tag = document.getElementById("hii");
        h2tag.textContent = 0;
        let c = 0;
        function inccount() {
            c++;
            h2tag.textContent = c;
        }
        function deccount() {
            if (c > 0) {
                c--;
                h2tag.textContent = c;
            }
        }
    </script>
</body>

</html>
