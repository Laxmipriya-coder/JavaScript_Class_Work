<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="mmh">Move mouse Here</h2>
    <script>
        let mmh = document.getElementById("mmh");

        mmh.onmouseover = function (){
            mmh.textContent = "Move is Over Me"
        }
    </script>
</body>
</html>
