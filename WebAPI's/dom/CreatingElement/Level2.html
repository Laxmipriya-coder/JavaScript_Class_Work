<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #btn {
            background: linear-gradient(145deg, #4facfe, #00c6fb);
            color: white;
            font-family:'Times New Roman', Times, serif;
            font-size: 20px;
            font-weight: bold;
            padding: 14px 40px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow:0 8px 20px rgba(0, 198, 251, 0.4),inset 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        #btn:hover {
            box-shadow:0 12px 28px rgba(0, 198, 251, 0.55),inset 0 2px 6px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>
    <button id="btn">Add Element</button>
    <div id="box"></div>


    <script>
        let butt = document.getElementById("btn");
        let container = document.getElementById("box");
        let count = 0;

        butt.addEventListener("click", function () {
            let pTag = document.createElement("p");
            count++;
            pTag.textContent = "Hello " + count;
            box.append(pTag);
        })
    </script>
</body>

</html>
