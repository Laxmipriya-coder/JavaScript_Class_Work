<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Login</a>
            <button class="btn btn-warning">Login</button>
        </div>
    </nav>

    <section class="container-fluid mt-3">
        <div class="row">
            <div class="col-6 m-auto">
                <div class="card">

                    <div class="card-header bg-warning text-center">
                        <h4>Login Form</h4>
                    </div>

                    <div class="card-body">

                        <form id="loginForm">

                            <div class="mb-2 input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person-circle"></i>
                                </span>

                                <input type="text" class="form-control" id="usn" value="">
                            </div>

                            <div class="mb-2 input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-eye-fill" id="eye-icon"></i>
                                </span>

                                <input type="password" class="form-control" id="pwd" value="">
                            </div>

                            <input type="submit" value="Login" class="btn btn-dark" id="btn">

                        </form>
                        <h2 id="text"></h2>

                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>

        let usnInp = document.getElementById("usn");
        let passInp = document.getElementById("pwd");
        let form = document.getElementById("loginForm");
        let eyeIcon = document.getElementById("eye-icon");

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            let usnVal = usnInp.value;

            if (usnVal.length <= 6) {
                alert("Enter a valid User Name");
            } else {
                alert("You enter a valid user name");
            }

        });


        form.addEventListener("submit",function(){
            event.preventDefault();

            let pwdval = passInp.value;

            if(pwdval.length <= 6){
                alert("Enter a valid password");
            }
            else{
                alert("You enter a valid  Password");
            }
        })

    </script>

</body>

</html>
