<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">JBANK</a>
            <a href="./task13.html" class="btn btn-warning">Login</a>
        </div>
    </nav>
    <section class="container-fluid mt-3">
        <div class="row">
            <div class="col-6 m-auto">
                <div class="card">
                    <div class="card-header bg-warning text-center">
                        <h4>Login Form</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3 input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person-circle"></i>
                                </span>
                                <input type="text" class="form-control" id="usn" placeholder="Enter username">
                            </div>
                            <div class="mb-3 input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill"></i>
                                </span>
                                <input type="password" class="form-control" id="pwd" placeholder="Enter password">
                            </div>
                            <input type="submit" value="Login" class="btn btn-dark" id="btn">
                        </form>
                        <h5 id="text" class="mt-3"></h5>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- JavaScript -->
    <script>

        let usnInp = document.getElementById("usn");
        let passInp = document.getElementById("pwd");
        let form = document.getElementById("loginForm");
        let text = document.getElementById("text");


        form.addEventListener("submit", function (event) {
            event.preventDefault();
            let usnVal = usnInp.value;
            let pwdVal = passInp.value;
            if (usnVal === "user") {
                alert("You Enter a valid User Name");
            }
            else{
                alert("Enter a valid user name");
            }

            if (pwdVal === "user123") {

                alert("You Enter a valid Password");
            }
            else{
                alert("Enter a valid Password");
            }
            text.innerText = "Login Successful!";

        });

    </script>

</body>

</html>
