<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <h1 id="count" class="bg-warning text-center">Counter App</h1>
    <section class="d-flex flex-wrap gap-3 justify-content-evenly mt-4">
    <div class="card text-center p-4">
        <div class="card-body">
            <h2 id="value">0</h2>
            <button id="btn1" class="btn btn-outline-success" >+1</button>
            <button id="btn2" class="btn btn-outline-success" >+2</button>
            <button id="btn3" class="btn btn-outline-success" >+5</button>
            <button id="btn4" class="btn btn-outline-success" >+10</button>
            <button id="btn5" class="btn btn-outline-danger" >Reset</button>
        </div>
    </div>
    </section>

    <script>
        let count = document.getElementById("count");
        let value = document.getElementById("value");

        let btn1 = document.getElementById("btn1");
        let btn2 = document.getElementById("btn2");
        let btn3 = document.getElementById("btn3");
        let btn4 = document.getElementById("btn4");
        let btn5 = document.getElementById("btn5");

        let c = 0;

        btn1.addEventListener("click", function () {
            c = c + 1;
            value.textContent = c;
        });

        btn2.addEventListener("click", function () {
            c = c + 2;
            value.textContent = c;
        });

        btn3.addEventListener("click", function () {
            c = c + 5;
            value.textContent = c;
        });

        btn4.addEventListener("click", function () {
            c = c + 10;
            value.textContent = c;
        });

        btn5.addEventListener("click", function () {
            c = 0;
            value.textContent = c;
        })
    </script>
</body>

</html>
