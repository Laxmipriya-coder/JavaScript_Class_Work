    <script>
        let num = 9;
        let squ = num * num;
        let sum = 0;
        while(squ > 0){
            let rem = squ % 10;
            sum += rem;
            squ = Math.trunc(squ/10);
        }
        if(sum == num){
            console.log("It is a Neon Number");
        }
        else{
            console.log("It is not a Neon Number");
        }

    </script>
