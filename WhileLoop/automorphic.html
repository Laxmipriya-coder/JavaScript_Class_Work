<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = 25;
        let square = num * num;

        while (num > 0) {
            if (num % 10 != square % 10) {
                console.log("Not Automorphic Number");
                break;
            }

            num = Math.trunc(num / 10);
            square = Math.trunc(square / 10);
        }

        if (num == 0) {
            console.log("Automorphic Number");
        }
    </script>
</body>

</html>
