<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Fetch API</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Company</th>
                <th>Website</th>
            </tr>
        </thead>
        <tbody id="row">
        </tbody>
    </table>
    <script>
        function makeAPI(){
            let p1= window.fetch("https://jsonplaceholder.typicode.com/users");
            console.log(p1);

            let p2 = p1.then((res)=>{
                return res.json();
                // extract the body properties and convert data into json format
            });
            p2.then((data)=>{
                console.log(data);
                let tableBody = document.getElementById("row");
                data.forEach((person)=>{
                    let createRow = document.createElement("tr");
                    
                    createRow.innerHTML = `
                    <td>${person.id}</td>
                    <td>${person.name}</td>
                    <td>${person.email}</td>
                    <td>${person.address["city"]}</td>
                    <td>${person.company.name}</td>
                    <td>${person.website}</td>
                    `
                    tableBody.append(createRow);
                });
                
            });
            p2.catch((err)=>{
                console.log(err);
            })
        }
        makeAPI();

        



    </script>
</body>
</html>
