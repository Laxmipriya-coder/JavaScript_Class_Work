<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
   <!-- Navbar -->
<nav class="navbar">
    <div class="logo">
        <span>Shopping Mart</span>
    </div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Electronics</a>
        <a href="#">Accessories</a>
        <a href="#">Audio</a>
        <a href="#">Wearables</a>
        <a href="#">Tablets</a>
    </div>
    <div class="box">
        <input type="text" id="find" placeholder="Search for products...">
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="nav-actions">
        <a href="#"><i class="fa-solid fa-user"></i> Login</a>
        <a href="#"><i class="fa-regular fa-heart"></i> Wishlist</a>
        <a href="#"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
    </div>
</nav>
<!-- Hero Section -->
<section class="hero">
    <div class="hero-content">
        <p class="small-title">NEW ARRIVALS</p>
        <h1>Latest Tech, Better Life</h1>
        <p class="para">
            Explore the best devices, accessories and more
            <br>
            at unbeatable prices.
        </p>
        <button class="btn">
            Shop Now
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>
    <div class="hero-image">
        <img src="./main.jpg" alt="Latest Technology">
    </div>
</section>

<!-- All products -->
<section class="products-section">
    <div class="products-heading">
        <h2>Featured Products</h2>
        <a href="#">
            View All
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>
    <div id="pbox" class="product-container"></div>
</section>

</body>
<script type="module" src="./services/api.js"></script>
</body>
</html>
