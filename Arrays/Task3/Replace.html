<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let marks = [80, 35, 90, 25, 70];

        marks.forEach((value, index) => {
            if (value < 40) {
                marks.splice(index, 1, 40);
            }
        });

        console.log(marks);
    </script>
</body>

</html>
