<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let a =[50,21,31,25,52,65];
        let sum = 0;
        let sum2 = 0;
        for(let i=0; i<a.length; i++){
            if(a[i]%2 == 0){
                sum += a[i];
            }
            else{
                sum2+=a[i];
            }
        }
        console.log(sum);
        console.log(sum2);
    </script>
</body>

</html>
