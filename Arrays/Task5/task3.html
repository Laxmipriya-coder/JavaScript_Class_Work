<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <input type="number" id="usn">
    <button id="add">Add</button>
    <button id="sum">Find Sum</button>
    <h1 id="message"></h1>
    <h2 id="mess"></h2>

    <script>
        let arr = [];
        let usnInp = document.getElementById("usn");
        let btn = document.getElementById("add");
        let sumbtn = document.getElementById("sum");
        let h1Tag = document.getElementById("message");
        let h2Tag = document.getElementById("mess");

        btn.addEventListener("click", () => {
            let usnVal = Number(usnInp.value);
            arr.push(usnVal);
            usnInp.value = ""; 
            console.log(arr);
            h1Tag.textContent = `[${arr}]`;
        });

        sumbtn.addEventListener("click", () => {
            let total = 0;
            for (let i = 0; i < arr.length; i++) {
                total = total + arr[i];
            }
            
            h2Tag.textContent = total;

        });

    </script>

</body>

</html>
