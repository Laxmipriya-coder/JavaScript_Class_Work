<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="form">
    <input type="number" id="usn">
    <button type="submit">Add</button>
    <h1 id="message"></h1>
    </form>

    <script>
        let arr = [];
        let formEle = document.getElementById("form");
        let usnInp = document.getElementById("usn");
        let h1Tag = document.getElementById("message");
        
        formEle.addEventListener("submit",(e)=>{
            e.preventDefault();
            let usnVal = usnInp.value;
            arr.push(usnVal);
            usnInp.usnVal = "";
            console.log(arr);
            h1Tag.textContent = `[${arr}]`
        });
        
    </script>
</body>
</html>
