<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./OperationTwoNumber.css">
</head>

<body>
    <section>
        <input type="number" id="inp1">
        <input type="number" id="inp2">
        <main>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <button class="opr" id="add">+</button>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <button class="opr" id="sub">-</button>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <button class="opr" id="mult">*</button>
            <div style="background-color: red; color: white; box-shadow: -3px 3px rgb(246, 104, 104) inset;">C</div>
            <div>0</div>
            <button class="opr" id="equal">=</button>
            <button class="opr" id="division">/</button>
        </main>
    </section>


    <script src="./OperationTwoNumber.js"></script>

</body>

</html>
