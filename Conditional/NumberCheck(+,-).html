<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a = Number(prompt("Enter a Number"));

        if (a > 0) {
            console.log(a + " This is a Positive Number");
        }
        else if(a < 0){
            console.log(a + " This is a Negative Number");
        }
        else if(a==0){
            console.log("Entered zero");
        }
        else{
            console.log("Not a Number");
        }
    </script>
</head>

<body>
    <h1>Number Check</h1>
</body>

</html>
