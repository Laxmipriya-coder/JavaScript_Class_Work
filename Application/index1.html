<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Task Management</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Task Management</a>
            <button class="btn btn-warning text-bold">Total Task: <span id="total-count">0</span></button>
        </div>
    </nav>
    <section class="container-fluid mt-4">
        <div class="row">
            <div class="col-5 m-auto">
                <form id="form-ele">
                    <div class="mb-2">
                        <input type="text" class="form-control" placeholder="Enter your task" id="task-input">
                        <br>
                        <input type="text" class="form-control" placeholder="Enter Description">
                    </div>
                    <input type="submit" value="Add Task" class="btn btn-warning btn-sm">
                </form>
            </div>
        </div>
    </section>

    <section class="container-fluid mt-4">
        <div class="row">
            <div class="col-5 m-auto">
                <ul class="list-group" id="list-display">
                   <!-- Displaying list here -->
                    
                </ul>
            </div>
        </div>
    </section>

    <script src="./script2.js"></script>
</body>
</html>
